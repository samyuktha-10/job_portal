<script>
/* Password show/hide toggle: attaches an eye button to every password field on the page. */
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('input[type="password"]').forEach(function (inp) {
        if (inp.dataset.pwdToggle) { return; }
        inp.dataset.pwdToggle = '1';

        var wrap = document.createElement('div');
        wrap.style.position = 'relative';
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        inp.style.paddingRight = '2.6rem';

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Show or hide password');
        btn.title = 'Show / hide password';
        btn.textContent = '\uD83D\uDC41';
        btn.style.cssText = 'position:absolute; right:10px; top:50%; transform:translateY(-50%);' +
            ' border:none; background:transparent; cursor:pointer; font-size:16px; line-height:1; padding:2px;';
        btn.addEventListener('click', function () {
            var show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            btn.textContent = show ? '\uD83D\uDE48' : '\uD83D\uDC41';
            inp.focus();
        });
        wrap.appendChild(btn);
    });
});
</script>
